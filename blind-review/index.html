<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薄片双人盲评 · 岩芯实验室</title>
<style>
  :root{--bg:#eef1ea;--panel:#fff;--ink:#232821;--muted:#6a7262;--line:#d6dcd0;--accent:#4e6d40;
        --accent2:#33546b;--warn:#a8531f;--bad:#a52f2f;--ok:#3a7a44;--amber:#946b16;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header h1{font-size:19px;margin:0;}
  header .sub{color:var(--muted);font-size:12px;}
  .login{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,input,textarea,button{font:inherit;}
  input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;color:var(--ink);}
  textarea{width:100%;min-height:54px;resize:vertical;}
  button{border:0;border-radius:6px;background:var(--accent);color:#fff;padding:8px 14px;font-weight:700;cursor:pointer;}
  button.sec{background:var(--accent2);}
  button.ghost{background:#eee;color:var(--ink);border:1px solid var(--line);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  main{padding:20px 22px;display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start;}
  .panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .panel{position:sticky;top:18px;}
  h2{font-size:16px;margin:0 0 12px;}
  h3{font-size:15px;margin:0 0 8px;}
  label{display:block;margin:9px 0 4px;color:var(--muted);font-size:12px;}
  .row{display:flex;gap:8px;align-items:center;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .card{cursor:pointer;}
  .card.active{outline:2px solid var(--accent);}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line);color:var(--muted);}
  .st-pending{color:var(--muted);} .st-reading{color:var(--accent2);}
  .st-consensus{color:var(--ok);} .st-adjudicating{color:var(--warn);}
  .st-adjudicated{color:var(--amber);} .st-published{color:var(--ok);background:#e8f2e8;}
  .meta{color:var(--muted);font-size:12px;line-height:1.7;}
  .blind{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.5px;}
  .minrow{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;margin-bottom:6px;}
  .sum{font-weight:700;margin:8px 0;}
  .sum.ok{color:var(--ok);} .sum.bad{color:var(--bad);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tabs button{background:#e2e7dd;color:var(--ink);}
  .tabs button.on{background:var(--accent);color:#fff;}
  .detail{display:none;} .detail.on{display:block;}
  .reading{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fafcf8;}
  .reading h4{margin:0 0 6px;font-size:13px;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;}
  .veil{background:#f4f1e8;border:1px dashed #c8b97a;color:#7a6a2e;border-radius:8px;padding:10px;margin:8px 0;font-size:13px;}
  .err{color:var(--bad);font-size:13px;margin:8px 0;white-space:pre-wrap;}
  .okmsg{color:var(--ok);font-size:13px;margin:8px 0;}
  .hist{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;}
  .tag-old{color:var(--bad);font-size:11px;border:1px solid var(--bad);border-radius:4px;padding:0 5px;}
  .tag-new{color:var(--ok);font-size:11px;border:1px solid var(--ok);border-radius:4px;padding:0 5px;}
  .muted{color:var(--muted);}
  .grow{flex:1;}
  @media(max-width:900px){main{grid-template-columns:1fr;}.panel{position:static;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>薄片双人盲评系统</h1>
    <div class="sub">批量编码 · 双人独立读片 · 分歧第三人裁决 · 版本留存 · 整批发布</div>
  </div>
  <div class="login">
    <label style="margin:0">角色</label>
    <select id="role">
      <option value="host">主持人</option>
      <option value="reader">读片人</option>
      <option value="adjudicator">第三人裁决人</option>
    </select>
    <label style="margin:0">姓名</label>
    <input id="name" placeholder="真实姓名" style="width:130px">
    <button id="enterBtn" class="sec">进入工作台</button>
  </div>
</header>

<main>
  <!-- 左：操作/列表 -->
  <section class="panel" id="left"></section>
  <!-- 右：明细 -->
  <section class="panel" id="right"><div class="muted">请先选择角色并输入姓名进入工作台。</div></section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS_CN = {pending:"待读片",reading:"读片中（已交1人）",consensus:"已达成共识",adjudicating:"分歧·待第三人裁决",adjudicated:"第三人已裁决",published:"已发布"};
let me = {role:null,name:null};
let state = {tab:"work", list:[], detail:null, batchCode:"", batches:[]};

function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : "id-"+Math.random().toString(16).slice(2)+Date.now()); }
async function api(method, path, body){
  const sep = path.includes("?") ? "&" : "?";
  const url = path + sep + "role=" + encodeURIComponent(me.role) + "&name=" + encodeURIComponent(me.name);
  const opt = {method, headers:{}};
  if(body !== undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const res = await fetch(url, opt);
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ const e = new Error(data.message || data.error || ("HTTP "+res.status)); e.code=data.error; throw e; }
  return data;
}

/* ------------------------------------------------------------- 登录 */
$("#enterBtn").onclick = ()=>{
  const name = $("#name").value.trim();
  const role = $("#role").value;
  if(!name){ alert("请输入姓名"); return; }
  me = {role,name}; state = {tab:"work",list:[],detail:null,batchCode:"",batches:[]};
  render(); refresh();
};

/* ------------------------------------------------------------- 渲染入口 */
function render(){
  const L = $("#left"), R = $("#right");
  if(!me.name){ L.innerHTML=""; return; }
  if(me.role==="host") renderHost(L);
  else if(me.role==="reader") renderReader(L);
  else renderAdjudicator(L);
  renderDetail(R);
}

function tabsHtml(tabs){
  return `<div class="tabs">${tabs.map(t=>`<button data-tab="${t.k}" class="${state.tab===t.k?'on':''}">${t.label}</button>`).join("")}</div>`;
}
function bindTabs(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.detail=null;render();refresh();});
}

/* ============================================================= 主持人 */
function renderHost(L){
  L.innerHTML = tabsHtml([{k:"work",label:"批次/裁决/发布"},{k:"encode",label:"批量编码"}]) + `
    <div class="detail ${state.tab==='work'?'on':''}" id="hostWork">
      <h2>我的批次</h2>
      <div class="row"><input id="batchInput" placeholder="输入批次号 如 B0001" value="${esc(state.batchCode)}" class="grow"><button id="loadBatch">查看</button></div>
      <div class="list" id="batchChips" style="margin-top:10px"></div>
    </div>
    <div class="detail ${state.tab==='encode'?'on':''}" id="hostEncode">
      <h2>批量编码并指派两名读片人</h2>
      <div id="encMsg"></div>
      <label>项目 / 批次说明</label><input id="project" placeholder="如 东岭铜矿 ZK-17 薄片批">
      <div class="row"><div class="grow"><label>默认读片人 A</label><input id="ra" placeholder="张工"></div>
        <div class="grow"><label>默认读片人 B</label><input id="rb" placeholder="李工"></div></div>
      <label>样本真实身份清单（每行一个；盲评期间对读片人隐藏）</label>
      <textarea id="identities" style="min-height:150px" placeholder="ZK-17 / 128.4m / 花岗闪长岩&#10;ZK-17 / 130.1m / 矿化带&#10;ZK-17 / 131.0m / 石英脉"></textarea>
      <div class="meta">每行生成一个连续盲码（如 B0001-S001）。可在某行用“身份 | 读片人A | 读片人B”为单个样本另指两人（仍须不同）。</div>
      <div style="margin-top:10px"><button id="doEncode">批量编码</button></div>
    </div>`;
  bindTabs();
  $("#loadBatch").onclick = async ()=>{ state.batchCode=$("#batchInput").value.trim(); await loadBatch(); };
  $("#doEncode").onclick = doEncode;
  renderBatchChips();
}
async function renderBatchChips(){
  try{
    const wl = await api("GET","/api/me/worklist");
    state.batches = wl.batches||[];
  }catch(e){ state.batches=[]; }
  const el=$("#batchChips"); if(!el) return;
  el.innerHTML = state.batches.length ? state.batches.map(c=>
    `<button class="ghost" data-bc="${esc(c)}" style="margin:3px">${esc(c)}</button>`).join("")
    : `<div class="muted">暂无批次。到“批量编码”创建。</div>`;
  el.querySelectorAll("[data-bc]").forEach(b=>b.onclick=async()=>{state.batchCode=b.dataset.bc;await loadBatch();});
}
async function doEncode(){
  const msg=$("#encMsg"); msg.innerHTML="";
  const project=$("#project").value.trim();
  const ra=$("#ra").value.trim(), rb=$("#rb").value.trim();
  const lines=$("#identities").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!project||!ra||!rb){ msg.innerHTML=errHtml("请填写项目和两名默认读片人"); return; }
  if(ra===rb){ msg.innerHTML=errHtml("两名读片人不能是同一人"); return; }
  if(!lines.length){ msg.innerHTML=errHtml("请至少录入一个样本身份"); return; }
  const samples=lines.map(line=>{
    const parts=line.split("|").map(x=>x.trim());
    if(parts.length>=3) return {identity:parts[0],reader_a:parts[1],reader_b:parts[2]};
    return {identity:line};
  });
  try{
    const r=await api("POST","/api/batches",{idempotency_key:uuid(),host:me.name,project,default_reader_a:ra,default_reader_b:rb,samples});
    msg.innerHTML=okHtml(`已编码批次 ${r.batch_code}，共 ${r.count} 个样本（整批成功或整批回滚）。`);
    $("#identities").value=""; state.batchCode=r.batch_code; state.tab="work"; render(); await loadBatch();
  }catch(e){ msg.innerHTML=errHtml(e.message); }
}
async function loadBatch(){
  try{ state.detail={kind:"batch",data:await api("GET","/api/batches/"+encodeURIComponent(state.batchCode))}; }
  catch(e){ state.detail={kind:"error",message:e.message}; }
  renderDetail($("#right")); renderBatchChips();
}

/* ============================================================= 读片人 */
function renderReader(L){
  L.innerHTML = `<h2>我的读片任务（盲态）</h2>
    <div class="meta">提交前你只能看到盲码与自己的记录，<b>看不到样本真实身份，也看不到对方是否已读、结论如何</b>。</div>
    <div class="list" id="rdList" style="margin-top:10px"></div>`;
}
async function refreshReaderList(){
  const wl = await api("GET","/api/me/worklist");
  state.list = wl.samples||[];
  const el=$("#rdList");
  if(!el) return;
  el.innerHTML = state.list.length ? state.list.map((s,i)=>
    `<div class="card ${state.detail&&state.detail.code===s.blind_code?'active':''}" data-i="${i}">
       <div class="row"><span class="blind">${esc(s.blind_code)}</span><span class="pill st-${s.status}">${STATUS_CN[s.status]||s.status}</span></div>
       <div class="meta">批次 ${esc(s.batch_code)} · ${s.my_reading?("你已提交 v"+s.my_reading.version+"（可更正）"):"尚未提交"}</div>
     </div>`).join("") : `<div class="muted">当前没有分配给你的待办。</div>`;
  el.querySelectorAll("[data-i]").forEach(c=>c.onclick=async()=>{
    const s=state.list[+c.dataset.i];
    try{ state.detail={kind:"sample",code:s.blind_code,data:await api("GET","/api/samples/"+encodeURIComponent(s.blind_code)),role:"reader"}; }
    catch(e){ state.detail={kind:"error",message:e.message}; }
    renderDetail($("#right"));
  });
}

/* ============================================================= 裁决人 */
function renderAdjudicator(L){
  L.innerHTML = `<h2>第三人裁决任务</h2>
    <div class="meta">你裁决的样本<b>不得是你本人读片的样本</b>；裁决前可见两份匿名结论（A/B），仍看不到样本真实身份。</div>
    <div class="list" id="adjList" style="margin-top:10px"></div>`;
}
async function refreshAdjList(){
  const wl = await api("GET","/api/me/worklist");
  state.list = wl.samples||[];
  const el=$("#adjList");
  if(!el) return;
  el.innerHTML = state.list.length ? state.list.map((s,i)=>
    `<div class="card ${state.detail&&state.detail.code===s.blind_code?'active':''}" data-i="${i}">
       <div class="row"><span class="blind">${esc(s.blind_code)}</span><span class="pill st-adjudicating">待你裁决</span></div>
       <div class="meta">批次 ${esc(s.batch_code)} · 第 ${s.round} 轮</div>
     </div>`).join("") : `<div class="muted">当前没有指派给你的待裁决样本。</div>`;
  el.querySelectorAll("[data-i]").forEach(c=>c.onclick=async()=>{
    const s=state.list[+c.dataset.i];
    try{ state.detail={kind:"sample",code:s.blind_code,data:await api("GET","/api/samples/"+encodeURIComponent(s.blind_code)),role:"adjudicator"}; }
    catch(e){ state.detail={kind:"error",message:e.message}; }
    renderDetail($("#right"));
  });
}

/* ============================================================= 右侧明细 */
function renderDetail(R){
  if(!me.name){ return; }
  const d=state.detail;
  if(!d){ R.innerHTML=`<div class="muted">${me.role==='host'?'查看一个批次以处理裁决与发布。':'从左侧选择一个盲码。'}</div>`; return; }
  if(d.kind==="error"){ R.innerHTML=errHtml(d.message); return; }
  if(d.kind==="batch") renderBatchDetail(R,d.data);
  if(d.kind==="sample") renderSampleDetail(R,d);
}

function mineralsTable(mins){
  return `<table><tr><th>矿物</th><th>比例(%)</th></tr>${mins.map(m=>`<tr><td>${esc(m.mineral)}</td><td>${m.percent}</td></tr>`).join("")}</table>`;
}
function readingBlock(title, r, who){
  if(!r) return `<div class="reading"><h4>${title}</h4><div class="muted">未提交</div></div>`;
  return `<div class="reading"><h4>${title} ${who?`· ${esc(who)}`:""} ${r.version?`v${r.version}`:""}</h4>
    <div><b>岩性：</b>${esc(r.lithology)}</div>
    ${mineralsTable(r.minerals)}
    <div class="meta" style="margin-top:6px"><b>依据：</b>${esc(r.rationale)}</div></div>`;
}

/* ---------- 批次明细（主持人） ---------- */
function renderBatchDetail(R,b){
  const canPublish = b.samples.every(s=>s.status==="consensus"||s.status==="adjudicated"||s.status==="published");
  R.innerHTML = `<div class="row" style="margin-bottom:8px">
      <h2 class="grow">批次 ${esc(b.code)}</h2>
      <span class="pill st-${b.status}">${b.status==="published"?"已发布":"进行中"}</span></div>
    <div class="meta">项目：${esc(b.project)} · 主持人：${esc(b.host)} · 样本 ${b.samples.length} 个</div>
    <div id="pubMsg"></div>
    <div style="margin:10px 0">
      <button id="publishBtn" ${b.status==="published"?"disabled":""}>整批发布（揭晓身份与结论）</button>
      <span class="meta">仅当全部样本为“共识”或“已裁决”时可发布。</span>
    </div>
    <div class="list" id="sampleList"></div>`;
  $("#publishBtn").onclick=async()=>publishBatch(b.code);
  const el=$("#sampleList");
  el.innerHTML=b.samples.map(s=>{
    const needAdj=s.status==="adjudicating";
    return `<div class="card" style="cursor:default">
      <div class="row"><span class="blind">${esc(s.blind_code)}</span><span class="pill st-${s.status}">${STATUS_CN[s.status]||s.status}</span></div>
      <div class="meta">真实身份：<b>${esc(s.identity)}</b><br>读片人 A：${esc(s.reader_a)} ｜ 读片人 B：${esc(s.reader_b)} ｜ 第 ${s.round} 轮</div>
      ${needAdj?`<div class="row" style="margin-top:8px">
         <input class="grow" data-adjname="${esc(s.blind_code)}" placeholder="指派第三人裁决人（不得为上述两人）">
         <button data-assign="${esc(s.blind_code)}">指派裁决</button></div>
         <div class="meta" data-assignmsg="${esc(s.blind_code)}"></div>`:""}
      ${s.adjudication&&!s.adjudication.pending?`<div class="meta">裁决人：${esc(s.adjudication.adjudicator||"")} · 岩性：${esc(s.adjudication.lithology)}</div>`:""}
      <div class="row" style="margin-top:8px"><button class="ghost" data-hist="${esc(s.blind_code)}">查看版本留痕</button></div>
      <div data-histbox="${esc(s.blind_code)}"></div>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-assign]").forEach(btn=>btn.onclick=async()=>{
    const code=btn.dataset.assign;
    const adj=el.querySelector(`[data-adjname="${CSS.escape(code)}"]`).value.trim();
    const msgEl=el.querySelector(`[data-assignmsg="${CSS.escape(code)}"]`);
    if(!adj){ msgEl.innerHTML=errHtml("请填写裁决人"); return; }
    try{ await api("POST",`/api/samples/${encodeURIComponent(code)}/adjudicator/assign`,{idempotency_key:uuid(),host:me.name,adjudicator:adj});
      msgEl.innerHTML=okHtml(`已指派 ${adj}`); await loadBatch(); }
    catch(e){ msgEl.innerHTML=errHtml(e.message); }
  });
  el.querySelectorAll("[data-hist]").forEach(btn=>btn.onclick=async()=>{
    const code=btn.dataset.hist, box=el.querySelector(`[data-histbox="${CSS.escape(code)}"]`);
    try{ const h=await api("GET",`/api/samples/${encodeURIComponent(code)}/history`); box.innerHTML=historyHtml(h); }
    catch(e){ box.innerHTML=errHtml(e.message); }
  });
}
async function publishBatch(code){
  const msg=$("#pubMsg");
  try{ const r=await api("POST",`/api/batches/${encodeURIComponent(code)}/publish`,{idempotency_key:uuid(),host:me.name});
    msg.innerHTML=okHtml(`已发布 ${r.published} 个样本（整批生效）。`); await loadBatch(); }
  catch(e){ msg.innerHTML=errHtml(e.message); }
}

/* ---------- 样本明细（读片人 / 裁决人） ---------- */
function renderSampleDetail(R,d){
  const s=d.data;
  const published=s.status==="published";
  let head=`<div class="row" style="margin-bottom:8px"><h2 class="grow blind">${esc(s.blind_code)}</h2>
     <span class="pill st-${s.status}">${STATUS_CN[s.status]||s.status}</span></div>
    <div class="meta">批次 ${esc(s.batch_code)} · 第 ${s.round} 轮</div>`;
  if(published){
    R.innerHTML=head+`<div class="okmsg" style="font-size:14px">已发布 · 真实身份揭晓：<b>${esc(s.identity)}</b></div>`
      +readingBlock("读片 A",s.reading_a,s.reading_a&&s.reading_a.reader)
      +readingBlock("读片 B",s.reading_b,s.reading_b&&s.reading_b.reader)
      +(s.adjudication?readingBlock("第三人裁决",s.adjudication,s.adjudication.adjudicator):"")
      +histButton(s.blind_code);
    bindHist(s.blind_code); return;
  }
  // 未发布：身份始终隐藏
  head += `<div class="veil">🔒 盲评中：样本真实身份已隐藏${d.role==="reader"?"；在双方都提交前，你也看不到对方的任何信息。":"；裁决结论公布前不揭晓身份。"}</div>`;

  if(d.role==="adjudicator"){
    R.innerHTML=head
      + readingBlock("匿名读片 A",s.reading_a)
      + readingBlock("匿名读片 B",s.reading_b)
      + decisionForm(s,"adjudicate");
    bindMineralForm(s,"adjudicate"); return;
  }

  // 读片人
  if(s.reading_a && s.reading_b){
    // 双方已交：盲态保护期结束，可见双方内容（身份仍隐藏）
    const myReading = s.my_slot==="a" ? s.reading_a : s.reading_b;
    R.innerHTML=head
      + readingBlock("读片 A",s.reading_a)+ readingBlock("读片 B",s.reading_b)
      +(s.adjudication && !s.adjudication.pending?readingBlock("第三人裁决",s.adjudication):
        `<div class="meta">${s.status==="adjudicating"?"两人存在分歧，等待/进行第三人裁决。":"两人达成共识。"}</div>`)
      +`<div class="meta" style="margin:8px 0">如发现本人读片有误，可在下方<b>更正</b>（你是读片${s.my_slot==="a"?"A":"B"}，当前 v${s.my_version}）；更正会使原共识/裁决失效并重新裁决，旧版将保留。</div>`
      + decisionForm(s,"amend",myReading) + histButton(s.blind_code);
    bindMineralForm(s,"amend"); bindHist(s.blind_code);
  }else{
    // 只可能看到自己那份
    const my=s.my_reading;
    R.innerHTML=head
      +(my?readingBlock("我的读片（已提交，可更正）",my):`<div class="meta">你尚未提交。提交前无法看到对方信息。</div>`)
      + decisionForm(s, my?"amend":"submit", my);
    bindMineralForm(s, my?"amend":"submit");
  }
}

/* ---------- 动态矿物表单 ---------- */
function decisionForm(s, mode, pref){
  const title = mode==="adjudicate"?"第三人裁决（以本结论作为最终鉴定）":(mode==="amend"?"更正我的读片（旧版留存，原共识/裁决失效）":"提交我的读片");
  const mins = (pref&&pref.minerals||[{mineral:"",percent:null},{mineral:"",percent:null}]);
  const rows = mins.map(m=>mineralRow(m.mineral,m.percent)).join("");
  return `<div class="reading" style="background:#fff"><h4>${title}</h4>
    <label>岩性</label><input data-f="lithology" value="${pref?esc(pref.lithology):""}" placeholder="如 花岗闪长岩">
    <label>矿物比例（%，合计必须正好 100）</label>
    <div id="minRows">${rows}</div>
    <button type="button" class="ghost" id="addMin">+ 添加矿物</button>
    <div class="sum" id="sumLine"></div>
    <label>鉴定依据</label><textarea data-f="rationale" placeholder="结构、构造、镜下特征等">${pref?esc(pref.rationale):""}</textarea>
    <div data-formmsg="" style="margin-top:8px"></div>
    <div style="margin-top:8px"><button id="submitDecision">${mode==="adjudicate"?"提交裁决":(mode==="amend"?"提交更正":"提交读片")}</button></div>
  </div>`;
}
function mineralRow(name,pct){
  return `<div class="minrow"><input data-m="name" placeholder="矿物名" value="${esc(name)}">
    <input data-m="pct" type="number" step="0.01" min="0" placeholder="%" value="${pct??""}">
    <button type="button" class="ghost" data-del>×</button></div>`;
}
function bindMineralForm(s, mode){
  const box=$("#minRows"); if(!box) return;
  const sumLine=$("#sumLine");
  const recalc=()=>{
    let total=0; box.querySelectorAll('[data-m="pct"]').forEach(i=>total+=parseFloat(i.value)||0);
    const ok=Math.abs(total-100)<0.01;
    sumLine.textContent="合计："+(Math.round(total*100)/100)+"%　"+(ok?"✔ 满足 100%":"✘ 必须为 100%");
    sumLine.className="sum "+(ok?"ok":"bad");
    $("#submitDecision").disabled=!ok;
  };
  box.addEventListener("click",e=>{ if(e.target.dataset.del!=null){ e.target.closest(".minrow").remove(); recalc(); }});
  box.addEventListener("input",recalc);
  $("#addMin").onclick=()=>{ box.insertAdjacentHTML("beforeend",mineralRow("","")); recalc(); };
  recalc();
  $("#submitDecision").onclick=async()=>{
    const minerals=[...box.querySelectorAll(".minrow")].map(r=>({
      mineral:r.querySelector('[data-m="name"]').value.trim(),
      percent:parseFloat(r.querySelector('[data-m="pct"]').value)
    })).filter(m=>m.mineral!=="");
    const lithology=$('[data-f="lithology"]').value.trim();
    const rationale=$('[data-f="rationale"]').value.trim();
    const msg=document.querySelector('[data-formmsg]');
    if(!lithology||!rationale){ msg.innerHTML=errHtml("岩性与依据不能为空"); return; }
    if(minerals.some(m=>!(m.percent>=0))){ msg.innerHTML=errHtml("矿物比例必须为非负数字"); return; }
    if(Math.abs(minerals.reduce((a,b)=>a+b.percent,0)-100)>0.01){ msg.innerHTML=errHtml("比例合计必须为 100%"); return; }
    try{
      if(mode==="adjudicate"){
        await api("POST",`/api/samples/${encodeURIComponent(s.blind_code)}/adjudication`,
          {idempotency_key:uuid(),adjudicator:me.name,lithology,minerals,rationale});
        state.detail=null; state.tab="work";
        await refresh(); render();
      }else{
        const payload={idempotency_key:uuid(),reader:me.name,lithology,minerals,rationale};
        if(mode==="amend"){ payload.action="amend"; payload.expected_version=s.my_version; }
        await api("POST",`/api/samples/${encodeURIComponent(s.blind_code)}/readings`,payload);
        await reloadCurrentSample(s.blind_code);
      }
    }catch(e){ document.querySelector('[data-formmsg]').innerHTML=errHtml(e.message); }
  };
}
async function reloadCurrentSample(code){
  try{ state.detail={kind:"sample",code,data:await api("GET","/api/samples/"+encodeURIComponent(code)),role:"reader"}; }
  catch(e){ state.detail={kind:"error",message:e.message}; }
  render();
}

/* ---------- 版本留痕 ---------- */
function histButton(code){ return `<div style="margin-top:10px"><button class="ghost" data-histbtn="${esc(code)}">查看历史版本（旧版留存/失效留痕）</button><div data-histarea="${esc(code)}"></div></div>`; }
function bindHist(code){
  const btn=document.querySelector(`[data-histbtn="${CSS.escape(code)}"]`); if(!btn) return;
  btn.onclick=async()=>{
    const area=document.querySelector(`[data-histarea="${CSS.escape(code)}"]`);
    try{ area.innerHTML=historyHtml(await api("GET",`/api/samples/${encodeURIComponent(code)}/history`)); }
    catch(e){ area.innerHTML=errHtml(e.message); }
  };
}
function historyHtml(h){
  const rs=(h.readings||[]).map(r=>`<tr>
      <td>${r.slot==="a"?"读片A":"读片B"}${r.reader?(" / "+esc(r.reader)):""}</td>
      <td>v${r.version} · 第${r.round}轮</td>
      <td>${esc(r.lithology)}</td>
      <td>${r.minerals.map(m=>esc(m.mineral)+" "+m.percent+"%").join("，")}</td>
      <td>${r.superseded?'<span class="tag-old">已作废(旧版留存)</span>':'<span class="tag-new">当前</span>'}</td></tr>`).join("");
  const as=(h.adjudications||[]).map(a=>`<tr>
      <td>${a.adjudicator?esc(a.adjudicator):"第三人"}${a.pending?"（待提交）":""}</td>
      <td>第${a.round}轮</td><td>${a.pending?"—":esc(a.lithology)}</td><td>${a.pending?"—":a.minerals.map(m=>esc(m.mineral)+" "+m.percent+"%").join("，")}</td>
      <td>${a.superseded?'<span class="tag-old">因更正失效</span>':'<span class="tag-new">当前</span>'}</td></tr>`).join("");
  return `<div class="hist"><table>
      <tr><th>归属</th><th>版本/轮次</th><th>岩性</th><th>矿物比例</th><th>状态</th></tr>${rs}${as||""}</table></div>`;
}
function errHtml(m){return `<div class="err">⚠ ${esc(m)}</div>`;}
function okHtml(m){return `<div class="okmsg">✔ ${esc(m)}</div>`;}

/* ------------------------------------------------------------- 刷新 */
async function refresh(){
  if(!me.name) return;
  try{
    if(me.role==="reader") await refreshReaderList();
    else if(me.role==="adjudicator") await refreshAdjList();
    else renderBatchChips();
  }catch(e){ /* 明细区展示 */ }
}
</script>
